<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spirit GPS">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="format-detection" content="telephone=no">
  <title>Spirit GPS</title>
  <!-- Connexions ouvertes dès le départ : la carte et la recherche démarrent plus vite -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com">
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com">
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" crossorigin>
  <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com">
  <link rel="dns-prefetch" href="https://d.basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root { --blue:#3a8df0; --muted:#8a9099; --text:#f4f5f7; --sf:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; margin:0; background:#0b0c0e; color:var(--text); overflow:hidden; overscroll-behavior:none;
      -webkit-text-size-adjust:100%; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
      font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; }
    body { display:flex; align-items:center; justify-content:center; position:fixed; inset:0; width:100%; touch-action:none; }
    input { -webkit-user-select:text; user-select:text; }
    :root { --top:47px; --bottom:23px; }
    @media (max-width:500px) { :root { --top:max(14px, calc(env(safe-area-inset-top, 0px) + 4px)); --bottom:max(12px, calc(env(safe-area-inset-bottom, 0px) - 8px)); } }
    .phone { position:relative; width:393px; height:852px; max-height:100vh; border-radius:46px; overflow:hidden;
      background:#0b0c0e; box-shadow:0 0 0 8px #000, 0 0 0 10px #2a2c30, 0 30px 80px rgba(0,0,0,.6); }
    @media (max-width:500px) { .phone { position:fixed; inset:0; width:auto; height:auto; max-height:none; border-radius:0; box-shadow:none; } }

    /* Carte (Leaflet) */
    #map { position:absolute; inset:0; z-index:0; background:#0b0c0e; outline:0; }
    .leaflet-container { background:#0b0c0e; font:inherit; }
    .leaflet-tile { will-change:transform; }

    .ui { position:absolute; inset:0; pointer-events:none; z-index:2; touch-action:none; }
    .scrim { position:absolute; top:0; left:0; right:0; height:calc(var(--top) + 18px); pointer-events:none !important;
      -webkit-backdrop-filter:blur(16px) saturate(1.5); backdrop-filter:blur(16px) saturate(1.5);
      -webkit-mask-image:linear-gradient(#000 50%, transparent); mask-image:linear-gradient(#000 50%, transparent); }
    .shield { position:absolute; inset:0; z-index:1; display:none; touch-action:none; }
    .shield.on { display:block; }
    .ui > * { pointer-events:auto; }
    svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

    /* ===== Barre du haut : favori / Spirit GPS / options ===== */
    .ui > .topbar { position:absolute; inset:0; z-index:8; pointer-events:none !important; animation:fadeIn .5s 1.4s both; }
    .topbar > * { pointer-events:auto; }
    .star { position:absolute; left:16px; top:var(--top); width:44px; height:44px; border-radius:50%;
      background:rgba(18,64,84,.82); border:1px solid rgba(70,160,230,.45); display:grid; place-items:center; color:var(--blue);
      -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); cursor:pointer; transition:opacity .2s, transform .2s; }
    .star:active { transform:scale(.92); }
    .star svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linejoin:round; transition:fill .2s; }
    .star.on svg { fill:currentColor; }
    .star.pop svg { animation:starpop .45s cubic-bezier(.3,1.6,.5,1); }
    @keyframes starpop { 0% { transform:scale(.6); } 60% { transform:scale(1.28); } 100% { transform:scale(1); } }

    .brand { position:absolute; left:50%; top:var(--top); transform:translateX(-50%); height:44px; padding:0 18px 0 8px; border-radius:22px;
      display:flex; align-items:center; gap:9px; white-space:nowrap; pointer-events:none !important;
      background:rgba(30,34,40,.58); -webkit-backdrop-filter:blur(18px) saturate(1.8); backdrop-filter:blur(18px) saturate(1.8);
      border:1px solid rgba(255,255,255,.11); box-shadow:0 6px 20px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.1); }
    .bmark { width:28px; height:28px; border-radius:9px; display:grid; place-items:center;
      background:linear-gradient(160deg,#6cb8ff,#2a68de); box-shadow:inset 0 1px 0 rgba(255,255,255,.38), 0 2px 8px rgba(42,104,222,.55); }
    .bmark svg { width:15px; height:15px; fill:#fff; stroke:#fff; stroke-width:1.4; stroke-linejoin:round; }
    .bname { font-family:var(--sf); font-size:17px; font-weight:600; letter-spacing:-.4px; text-shadow:0 1px 6px rgba(0,0,0,.35); }
    .bname span { color:#5aa9ff; }

    .pill { position:absolute; right:16px; top:calc(var(--top) + 1px); height:41px; width:41px; border-radius:21px; display:flex; align-items:center; justify-content:center;
      background:rgba(18,64,84,.82); border:1px solid rgba(70,160,230,.45); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); color:var(--blue); }
    .pill div { width:38px; height:34px; display:grid; place-items:center; cursor:pointer; }
    .pill svg { width:22px; height:22px; }
    .topbar.favs .star { opacity:0; transform:scale(.85); pointer-events:none; }

    /* Repère de cible */
    .target { position:absolute; left:50%; top:40%; z-index:5; width:28px; height:28px; margin:-14px 0 0 -14px; border-radius:50%;
      border:1.5px solid var(--blue); pointer-events:none !important; }
    .target.off { display:none; }
    .marker { position:absolute; left:50%; top:40%; width:0; height:0; display:none; z-index:5; pointer-events:none !important; }
    .marker.on { display:block; }
    .marker .ripple { position:absolute; left:-9px; top:-9px; width:18px; height:18px; border-radius:50%; border:2px solid rgba(63,208,255,.85); opacity:0; animation:ripple 1.5s ease-out both; }
    .marker .ripple.r2 { animation-delay:.3s; }
    .marker .ripple.r3 { animation-delay:.6s; }
    .marker .dot { position:absolute; left:-9px; top:-9px; width:18px; height:18px; border-radius:50%; background:#2f86ff; border:3px solid #fff; box-sizing:border-box;
      box-shadow:0 2px 6px rgba(0,0,0,.45); animation:dotin .4s .3s cubic-bezier(.3,1.6,.5,1) both, halo 2.2s 1.2s ease-out infinite; }
    .marker .needle { position:absolute; left:-12px; top:-44px; width:24px; height:46px; overflow:visible; filter:drop-shadow(0 0 6px rgba(63,208,255,.55)); animation:pindrop .55s cubic-bezier(.25,.9,.3,1.25) both; }
    @keyframes pindrop { from { transform:translateY(-36px) scale(.8); opacity:0; } to { transform:none; opacity:1; } }
    @keyframes dotin { from { transform:scale(0); } to { transform:scale(1); } }
    @keyframes ripple { 0% { transform:scale(.6); opacity:.9; } 100% { transform:scale(5.5); opacity:0; } }
    @keyframes halo { 0% { box-shadow:0 2px 6px rgba(0,0,0,.45), 0 0 0 0 rgba(47,134,255,.55); } 100% { box-shadow:0 2px 6px rgba(0,0,0,.45), 0 0 0 16px rgba(47,134,255,0); } }
    .target::after { content:""; position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:var(--blue); }

    /* Pile du bas */
    .stack { position:absolute; z-index:10; left:0; right:0; bottom:calc(var(--bottom) + var(--kb, 0px)); display:flex; flex-direction:column; align-items:stretch; pointer-events:none; transition:bottom .25s ease; }
    .stack > * { pointer-events:auto; }

    .panel { position:relative; margin:0 13px; padding:13px; border-radius:26px; background:rgba(38,42,48,.94); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); box-shadow:0 8px 30px rgba(0,0,0,.4); }
    .panel.away { display:none; }
    .field { display:flex; align-items:center; gap:9px; height:42px; padding:0 13px; border-radius:13px; background:rgba(255,255,255,.055); color:var(--muted); }
    .field input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:16px; }
    .field input::placeholder { color:#6d747d; }
    .field svg { width:19px; height:19px; flex:none; }
    .field svg#sbtn { cursor:pointer; }
    .row { display:flex; align-items:center; gap:10px; padding:10px 4px 6px; }
    .row .ico { color:var(--blue); width:26px; height:26px; }
    .txt { flex:1; min-width:0; }
    .txt b { display:block; font-size:15px; font-weight:600; letter-spacing:-.1px; }
    .txt small { display:block; font-size:12.5px; line-height:1.3; color:var(--muted); margin-top:1px; }
    .switch { position:relative; width:51px; height:31px; border-radius:31px; background:#3b4149; flex:none; cursor:pointer; transition:background .2s; }
    .switch::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.3); transition:transform .2s; }
    .switch.on { background:#2a66b8; }
    .switch.on::after { transform:translateX(20px); }

    /* Résultats de recherche (s'ouvrent au-dessus du panneau) */
    .results { position:absolute; left:0; right:0; bottom:calc(100% + 10px); display:none; max-height:min(44vh, 310px); overflow-y:auto; touch-action:pan-y; overscroll-behavior:contain;
      border-radius:20px; background:rgba(34,38,44,.98); border:1px solid rgba(255,255,255,.07); box-shadow:0 12px 36px rgba(0,0,0,.5); }
    .results.on { display:block; animation:popUp .22s cubic-bezier(.2,.8,.2,1); }
    @keyframes popUp { from { opacity:0; transform:translateY(8px) scale(.98); } to { opacity:1; transform:none; } }
    .res { display:flex; align-items:center; gap:11px; padding:10px 14px; cursor:pointer; }
    .res + .res { border-top:1px solid rgba(255,255,255,.06); }
    .res:active, .res.sel { background:rgba(58,141,240,.16); }
    .res .ri { width:34px; height:34px; border-radius:10px; background:rgba(58,141,240,.18); display:grid; place-items:center; font-size:18px; flex:none; color:var(--blue); }
    .res .ri svg { width:18px; height:18px; }
    .res .rt { min-width:0; flex:1; }
    .res .rt b { display:block; font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .res .rt small { display:block; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }

    /* Sélection + validation */
    .pick { margin-top:10px; padding:10px; border-radius:15px; background:rgba(58,141,240,.1); border:1px solid rgba(58,141,240,.28); }
    .pick .where { display:flex; align-items:center; gap:11px; }
    .pico { width:40px; height:40px; border-radius:12px; background:rgba(58,141,240,.16); display:grid; place-items:center; flex:none; color:var(--blue); font-size:22px; line-height:1; }
    .pico svg { width:21px; height:21px; }
    .pick .txt b { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pick .txt small { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    #pSub { color:#aab1ba; }
    #pSub:empty { display:none; }
    #pCoords { font-variant-numeric:tabular-nums; font-size:12px; }
    .validate { position:relative; display:flex; align-items:center; justify-content:center; margin-top:9px; width:100%; height:42px; border:0; border-radius:12px; background:var(--blue); color:#fff; font:inherit; font-size:16px; font-weight:600; cursor:pointer; transition:background .4s ease, opacity .2s, transform .15s; }
    .validate .vi { position:absolute; left:16px; top:50%; width:22px; height:22px; margin-top:-11px; display:grid; place-items:center; }
    .validate .vi svg { width:22px; height:22px; stroke:#fff; stroke-width:2; }
    .validate #vlabel { padding:0 40px; text-align:center; white-space:nowrap; letter-spacing:-.2px; }
    .validate:active { transform:scale(.98); }
    .validate span { display:inline-block; transition:opacity .15s ease; }
    .validate:disabled { opacity:.4; cursor:default; }
    .validate.ok { background:#2fbf6b; }
    .validate.stop { background:#ff4743; }

    .tabs { margin:15px 22px 0; height:59px; padding:4px; display:flex; border-radius:30px;
      background:rgba(38,42,48,.94); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); box-shadow:0 8px 30px rgba(0,0,0,.4); }
    .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:26px; color:#9aa1aa; font-size:10px; font-weight:500; cursor:pointer; user-select:none; transition:background .2s, color .2s; }
    .tab svg { width:26px; height:26px; }
    /* Logo Spirit GPS : beaucoup plus transparent (30 %) */
    .brand { background:rgba(14,16,20,.3); }
    /* Bouton valider : même verre, teinté, à 90 % */
    .validate { background:rgba(58,141,240,.9); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
      border:1px solid rgba(255,255,255,.18); box-shadow:0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.22); }
    .validate.ok { background:rgba(47,191,107,.9); }
    .validate.stop { background:rgba(255,71,67,.9); }
    .tab.active { background:rgba(255,255,255,.08); color:var(--blue); }
    .legal { position:absolute; left:0; right:0; bottom:2px; line-height:1; text-align:center; font-size:8.5px; color:rgba(255,255,255,.5); pointer-events:none !important; }

    .toast { position:absolute; z-index:20; left:50%; bottom:calc(100% + 8px); max-width:calc(100% - 26px); width:max-content; padding:9px 18px; border-radius:20px;
      font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif; font-size:14px; font-weight:500; letter-spacing:-.15px; line-height:1.25; color:var(--text); text-align:center;
      background:rgba(38,42,48,.94); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); box-shadow:0 8px 30px rgba(0,0,0,.4);
      opacity:0; transform:translate(-50%,8px) scale(.96); transform-origin:50% 100%; pointer-events:none !important;
      transition:opacity .55s ease, transform .55s cubic-bezier(.4,0,.2,1); }
    .toast.show { opacity:1; transform:translate(-50%,0) scale(1); transition:opacity .25s ease, transform .35s cubic-bezier(.2,.8,.2,1); }

    /* ===== Page Favoris (style Apple) ===== */
    .page { position:absolute; inset:0; z-index:6; opacity:0; visibility:hidden; transform:translateY(14px) scale(.985);
      transition:opacity .28s ease, transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s .38s;
      background:radial-gradient(120% 55% at 50% 0%, rgba(58,141,240,.18), rgba(11,12,14,0) 62%), #0b0c0e; }
    .page.on { opacity:1; visibility:visible; transform:none; transition:opacity .28s ease, transform .38s cubic-bezier(.2,.8,.2,1), visibility 0s; }
    .pscroll { position:absolute; inset:0; overflow-y:auto; touch-action:pan-y; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
      padding:calc(var(--top) + 64px) 16px calc(var(--bottom) + 120px);
      -webkit-mask-image:linear-gradient(to bottom, transparent calc(var(--top) + 30px), #000 calc(var(--top) + 64px));
      mask-image:linear-gradient(to bottom, transparent calc(var(--top) + 30px), #000 calc(var(--top) + 64px)); }
    .ph { display:flex; align-items:flex-end; justify-content:space-between; padding:0 4px; }
    .ph h1 { margin:0; font-family:var(--sf); font-size:34px; line-height:1.1; font-weight:700; letter-spacing:.37px; }
    .link { background:none; border:0; color:var(--blue); font:inherit; font-size:17px; padding:6px 2px; cursor:pointer; }
    .psub { margin:3px 4px 18px; color:var(--muted); font-size:15px; }
    .group { display:none; border-radius:20px; background:rgba(38,42,48,.9); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); }
    .fav { position:relative; display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer; transition:background .15s, opacity .25s, transform .25s; }
    .fav + .fav::before { content:""; position:absolute; top:0; left:70px; right:0; height:1px; background:rgba(255,255,255,.07); }
    .fav:active { background:rgba(255,255,255,.06); }
    .fav.gone { opacity:0; transform:translateX(-24px); }
    .fav .fi { width:46px; height:46px; border-radius:13px; display:grid; place-items:center; font-size:25px; line-height:1; flex:none; color:#fff;
      background:linear-gradient(160deg,#5aaeff,#2866d8); box-shadow:inset 0 1px 0 rgba(255,255,255,.3); }
    .fav .fi svg { width:22px; height:22px; }
    .fav .ft { flex:1; min-width:0; }
    .fav .ft b { display:block; font-size:16px; font-weight:600; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fav .ft small { display:block; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
    .fav .ft .fc { font-size:11.5px; color:#6d747d; font-variant-numeric:tabular-nums; margin-top:2px; }
    .fav .chev { width:14px; height:14px; color:#5b626b; flex:none; }
    .fav .del { position:relative; width:0; height:22px; margin:0; padding:0; border:0; border-radius:50%; background:#ff453a; flex:none; opacity:0; overflow:hidden; cursor:pointer; transition:width .25s, margin .25s, opacity .2s; }
    .fav .del::after { content:""; position:absolute; left:5px; right:5px; top:10px; height:2px; border-radius:1px; background:#fff; }
    .editing .fav .del { width:22px; margin-right:2px; opacity:1; }
    .editing .fav .chev { display:none; }
    .empty { display:none; text-align:center; padding:64px 28px 0; color:var(--muted); }
    .empty .eico { width:76px; height:76px; border-radius:24px; margin:0 auto 18px; display:grid; place-items:center; color:var(--blue); background:rgba(58,141,240,.14); }
    .empty .eico svg { width:36px; height:36px; }
    .empty b { display:block; color:var(--text); font-size:21px; font-weight:600; margin-bottom:6px; }
    .empty p { margin:0; font-size:15px; line-height:1.4; }

    /* ===== Intro (moins de 2 s) — allégée : plus de flou plein écran animé ===== */
    .splash { position:absolute; inset:0; z-index:100; touch-action:none; overflow:hidden; display:grid; place-items:center;
      background:radial-gradient(circle at 50% 50%, rgba(22,36,62,.97), rgba(8,10,14,.98) 75%);
      animation:splashOut .5s 1.4s ease-in forwards; }
    .splash > * { grid-area:1 / 1; justify-self:center; align-self:center; margin-top:-9vh; }
    .splash .glow { width:230px; height:230px; border-radius:50%; pointer-events:none; will-change:transform, opacity;
      background:radial-gradient(circle, rgba(80,150,255,.42) 0%, rgba(80,150,255,.14) 40%, rgba(80,150,255,0) 70%);
      animation:glowIn 1s .05s cubic-bezier(.2,.8,.2,1) both; }
    .splash .shadow { position:relative; top:44px; width:50px; height:12px; border-radius:50%; pointer-events:none;
      background:radial-gradient(ellipse, rgba(0,0,0,.5), rgba(0,0,0,0) 70%);
      animation:shadowIn .7s .25s ease-out both, shadowOut .45s 1.4s ease-in forwards; }
    .splash .logo { position:relative; will-change:transform, opacity; animation:logoIn .75s cubic-bezier(.2,.9,.25,1.1) both, logoOut .45s 1.4s ease-in forwards; }
    .splash .logo img { display:block; height:64px; width:auto; pointer-events:none; -webkit-user-drag:none; will-change:transform;
      filter:drop-shadow(0 10px 16px rgba(0,0,0,.38)) drop-shadow(0 0 22px rgba(47,134,255,.5));
      animation:float 1.2s .7s ease-in-out both; }
    .splash .orbit { position:relative; width:132px; height:132px; will-change:transform, opacity;
      animation:spin 1.25s .15s cubic-bezier(.45,.05,.25,1) both, fadeIn .3s .15s both, orbitOut .3s 1.35s ease-in forwards; }
    .splash .orbit svg.ring { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    .splash .orbit .arrow { position:absolute; left:50%; top:0; width:20px; height:20px; margin:-10px 0 0 -10px; transform:rotate(90deg); filter:drop-shadow(0 0 5px rgba(47,134,255,.85)); }
    @keyframes logoIn { from { opacity:0; transform:scale(.72); } to { opacity:1; transform:scale(1); } }
    @keyframes logoOut { to { opacity:0; transform:scale(1.16); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-3px); } }
    @keyframes glowIn { from { opacity:0; transform:scale(.55); } to { opacity:1; transform:scale(1); } }
    @keyframes shadowIn { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:scale(1); } }
    @keyframes shadowOut { to { opacity:0; } }
    @keyframes spin { from { transform:rotate(-40deg); } to { transform:rotate(500deg); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes orbitOut { to { opacity:0; transform:scale(1.25); } }
    @keyframes splashOut { to { opacity:0; } }
    @keyframes rise { from { opacity:0; transform:translateY(26px); } to { opacity:1; transform:none; } }
    .stack { animation:rise .7s 1.3s cubic-bezier(.2,.8,.2,1) both; }
  
    /* ===== Verre sombre : simple blur sombre, translucide, bord fin (pas de liquid glass complet) ===== */
    :root { --glass:rgba(14,16,20,.9); --glass-strong:rgba(14,16,20,.92); --glass-line:rgba(255,255,255,.1); --glass-blur:blur(42px) saturate(1.6) brightness(.85); }
    .panel, .tabs, .toast, .brand { background:var(--glass); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-line); box-shadow:0 10px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.07); }
    .results { background:var(--glass-strong); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
      border:1px solid var(--glass-line); box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); }
    .star, .pill { background:rgba(14,28,46,.9); border:1px solid rgba(110,170,255,.28); -webkit-backdrop-filter:var(--glass-blur); backdrop-filter:var(--glass-blur);
      box-shadow:0 6px 20px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07); }
    .group { background:rgba(26,29,35,.9); -webkit-backdrop-filter:blur(36px) saturate(1.5); backdrop-filter:blur(36px) saturate(1.5); box-shadow:inset 0 0 0 1px var(--glass-line); }
    .field { background:rgba(255,255,255,.07); }
    .tab.active { background:rgba(255,255,255,.11); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); }
  </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  'use strict';
  // ───────── App fixe : pas de zoom de page (la carte garde son propre zoom) ─────────
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());

  const $ = id => document.getElementById(id);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const PIN = '<svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';

  setTimeout(() => { const sp = $('splash'); if (sp) sp.remove(); }, 1900);   // intro < 2 s

  // ───────── Toast ─────────
  const toastEl = $('toast'); let toastTimer;
  function say(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1250);
  }
  document.querySelectorAll('[data-toast]').forEach(el => el.onclick = () => say(el.dataset.toast));

  // ───────── Clavier : le panneau remonte au-dessus du clavier ─────────
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const upd = () => document.documentElement.style.setProperty('--kb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px');
    vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd);
  }

  // ───────── Carte ─────────
  const TY = 0.4;                                   // le viseur est à 40 % de la hauteur (comme le CSS .target)
  const LAYERS = {
    plan: { url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', opt: { subdomains: 'abcd', maxZoom: 19 }, attr: '© OpenStreetMap · © CARTO' },
    sat:  { url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', opt: { maxNativeZoom: 18, maxZoom: 19 }, attr: 'Imagery © Esri, Maxar, Earthstar Geographics' }
  };
  let map = null, layerKey = 'sat';
  const layerCache = {};

  if (window.L) {
    map = L.map('map', {
      center: [51.558922, 13.541017], zoom: 3, minZoom: 2, maxZoom: 19,
      zoomControl: false, attributionControl: false, worldCopyJump: true,
      wheelPxPerZoomLevel: 90, inertiaDeceleration: 3200
    });
    const layerOf = k => layerCache[k] || (layerCache[k] = L.tileLayer(LAYERS[k].url,
      Object.assign({ keepBuffer: 3, updateWhenIdle: false, updateInterval: 100 }, LAYERS[k].opt)));
    window.setLayer = k => {
      if (!LAYERS[k]) k = 'plan';
      Object.keys(layerCache).forEach(x => { if (x !== k) map.removeLayer(layerCache[x]); });
      layerOf(k).addTo(map); layerKey = k; $('legal').textContent = LAYERS[k].attr; store.set('spiritgps:layer', k);
    };
    setLayer(layerKey);
    let rz; new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => map.invalidateSize({ animate: false, pan: false })); }).observe($('map'));
  } else {
    say('Carte indisponible — vérifie ta connexion');
  }

  function targetLL() {                             // coordonnées exactes sous le viseur
    if (!map) return null;
    const s = map.getSize(), ll = map.containerPointToLatLng(L.point(s.x / 2, s.y * TY)).wrap();
    return { lat: Math.max(-85, Math.min(85, ll.lat)), lng: ll.lng };
  }
  function centerFor(lat, lng, z) {                 // centre de carte pour que (lat,lng) tombe sous le viseur
    const s = map.getSize();
    return map.unproject(map.project([lat, lng], z).add([0, s.y * (0.5 - TY)]), z);
  }
  let flyTarget = null;
  function flyToPlace(lat, lng, z) {
    if (!map) return;
    z = Math.max(2, Math.min(19, z || 15));
    const c = centerFor(lat, lng, z); flyTarget = { lat, lng, z };
    if (document.hidden) map.setView(c, z, { animate: false });
    else map.flyTo(c, z, { duration: 1.15, easeLinearity: .25 });
  }
  function distM(a, b) {
    const r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
    return 2 * 6371000 * Math.asin(Math.min(1, Math.sqrt(x)));
  }

  // ───────── Géocodage (Nominatim) : limité à 1 requête / seconde ─────────
  const NOM = 'https://nominatim.openstreetmap.org';
  let nextSlot = 0;
  async function slot(signal) {
    const now = Date.now(), at = Math.max(now, nextSlot); nextSlot = at + 1100;
    if (at > now) await sleep(at - now);
    if (signal && signal.aborted) throw new DOMException('aborted', 'AbortError');
  }
  const flagOf = cc => /^[A-Za-z]{2}$/.test(cc || '') ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '';
  const uniq = a => a.filter((x, i) => a.indexOf(x) === i);

  function infoFrom(j, forSearch) {                 // ville / région / pays + drapeau
    const a = j.address || {};
    const city = a.city || a.town || a.village || a.municipality || a.hamlet || a.city_district || a.suburb || '';
    const region = a.state || a.region || a.state_district || a.county || '';
    const country = a.country || '';
    let title;
    if (forSearch) title = j.name || city || region || country || (j.display_name || '').split(',')[0];
    else title = city || region || country || '';
    const parts = forSearch ? [city, region, country] : [region, country];
    let sub = uniq(parts.filter(Boolean).filter(x => x !== title)).join(', ');
    if (!sub && title === country) sub = 'Pays';
    return { title: title || 'Position sélectionnée', sub, flag: flagOf(a.country_code), cc: (a.country_code || '').toUpperCase() };
  }

  const revCache = new Map(); let revCtl = null;
  async function reverseInfo(lat, lng, z, signal) {
    const rzoom = z <= 4 ? 3 : z <= 7 ? 5 : z <= 12 ? 10 : 14;
    const dec = rzoom <= 5 ? 1 : rzoom === 10 ? 2 : 3;
    const key = rzoom + ':' + lat.toFixed(dec) + ',' + lng.toFixed(dec);
    if (revCache.has(key)) return revCache.get(key);
    await slot(signal);
    const r = await fetch(NOM + '/reverse?format=jsonv2&addressdetails=1&accept-language=fr&zoom=' + rzoom + '&lat=' + lat + '&lon=' + lng, { signal });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    const info = j.error ? { title: 'Zone sans adresse', sub: 'Pas de ville ni de pays connu', flag: '', cc: '' } : infoFrom(j, false);
    revCache.set(key, info);
    return info;
  }
  function ensureInfo(c) {                          // une seule requête par position
    if (c.info) return Promise.resolve(c.info);
    if (!c.p) c.p = (async () => {
      const ctl = (revCtl = new AbortController());
      try { c.info = await reverseInfo(c.lat, c.lng, c.z || (map ? map.getZoom() : 10), ctl.signal); }
      catch (e) { c.info = { title: 'Position sélectionnée', sub: 'Adresse indisponible', flag: '', cc: '', failed: true }; }
      return c.info;
    })();
    return c.p;
  }

  async function searchPlaces(q, signal) {
    await slot(signal);
    const r = await fetch(NOM + '/search?format=jsonv2&addressdetails=1&limit=6&accept-language=fr&q=' + encodeURIComponent(q), { signal });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    return j.map(x => {
      let z = 14;
      if (x.boundingbox && map) {
        const [s, n, w, e] = x.boundingbox.map(Number);
        z = Math.max(3, Math.min(17, map.getBoundsZoom(L.latLngBounds([s, w], [n, e]), false)));
        if (Math.abs(e - w) > 180) z = 4;           // pays avec territoires d'outre-mer
      }
      const info = infoFrom(x, true);
      if (x.addresstype === 'country') info.sub = 'Pays';
      return { lat: +x.lat, lng: +x.lon, zoom: z, info };
    }).filter(r => isFinite(r.lat) && isFinite(r.lng));
  }

  // Lit des coordonnées : lien LookMap (#c=zoom/lng/lat) ou "lat, lng"
  function parseCoords(q) {
    let m = (q || '').match(/#c=(\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)/);
    let c = null;
    if (m) c = { zoom: +m[1], lng: +m[2], lat: +m[3] };
    else if ((m = (q || '').trim().match(/^(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)$/))) c = { zoom: 15, lat: +m[1], lng: +m[2] };
    return c && Math.abs(c.lat) <= 90 && Math.abs(c.lng) <= 180 ? c : null;
  }

  // ───────── Position courante + boîte de sélection ─────────
  let cur = null, manual = true, locked = false, phase = 'idle', stopTimer, coordTimer, revTimer;
  const sw = $('sw'), target = document.querySelector('.target'), validateBtn = $('validate'), shield = $('shield'), pin = $('pin'), star = $('star');
  const fmt = (lat, lng) => lat.toFixed(6) + ', ' + lng.toFixed(6);
  const fmtLL = (lat, lng) => 'Lng ' + lng.toFixed(6) + ' · Lat ' + lat.toFixed(6);

  function setText(el, t) {
    if (el.textContent === t) return;
    el.textContent = t;
    if (el.animate) el.animate([{ opacity: .25 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
  }
  function showCur() {                              // ville / pays / coordonnées dans la boîte
    const i = cur && cur.info;
    if (!cur) {
      setText($('pName'), manual ? 'Position du viseur' : 'Aucune position sélectionnée');
      $('pSub').textContent = '';
      $('pIcon').innerHTML = PIN;
      if (phase === 'idle') $('pCoords').textContent = manual ? 'Place le viseur sur la carte puis valide' : 'Cherche un lieu ou colle des coordonnées';
      return;
    }
    setText($('pName'), i ? i.title : 'Position du viseur');
    setText($('pSub'), i ? i.sub : 'Recherche de l’adresse…');
    if (i && i.flag) $('pIcon').textContent = i.flag; else $('pIcon').innerHTML = PIN;
    if (phase === 'idle') $('pCoords').textContent = fmt(cur.lat, cur.lng);
  }
  function refreshManual() {
    target.classList.toggle('off', !manual || locked);
    validateBtn.disabled = !manual && !cur;
    showCur();
  }
  function afterInfo(c) { ensureInfo(c).then(() => { if (cur === c) { showCur(); refreshStar(); } }); }

  // La carte a bougé : on suit le viseur et on affiche la ville / le pays
  function onMoved() {
    if (!map || locked || !manual || phase !== 'idle') return;
    const t = targetLL(); if (!t) return;
    if (cur && distM(cur, t) < (cur.fromSearch ? 25 : 2)) return;
    if (revCtl) revCtl.abort();
    const c = cur = { lat: t.lat, lng: t.lng, info: null };
    showCur(); refreshStar();
    clearTimeout(revTimer); revTimer = setTimeout(() => { if (cur === c) afterInfo(c); }, 500);
  }
  if (map) map.on('moveend', () => { flyTarget = null; onMoved(); });

  function syncFromTarget() {                       // valide exactement ce qui est sous le viseur
    const t = targetLL(); if (!t) return;
    if (cur && distM(cur, t) < (cur.fromSearch ? 25 : 2)) return;
    if (revCtl) revCtl.abort();
    cur = { lat: t.lat, lng: t.lng, info: null };
    afterInfo(cur);
  }

  function selectPlace(p) {                         // recherche, coordonnées ou favori → carte
    if (locked || phase !== 'idle') release();
    if (revCtl) revCtl.abort(); clearTimeout(revTimer);
    const c = cur = { lat: p.lat, lng: p.lng, z: p.zoom || 15, info: p.info || null, fromSearch: true };
    refreshManual(); refreshStar();
    if (!c.info) afterInfo(c);
    flyToPlace(p.lat, p.lng, p.zoom || 15);
  }

  sw.onclick = () => {
    sw.classList.toggle('on'); manual = sw.classList.contains('on');
    if (!manual) { if (locked) { cur = null; release(); } else if (cur && !cur.fromSearch) cur = null; }
    say(manual ? 'Localisation manuelle activée' : 'Localisation manuelle désactivée');
    refreshManual(); refreshStar();
    if (manual) onMoved();
  };

  const vlabel = $('vlabel');
  const vicon = $('vicon');
  const ICONS = {
    go:   '<svg viewBox="0 0 24 24"><path d="M12 2.5l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/></svg>',
    ok:   '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    stop: '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3" fill="#fff" stroke="none"/></svg>'
  };
  function setLabel(t, ic) {
    vlabel.style.opacity = 0; vicon.style.opacity = 0;
    setTimeout(() => { vlabel.textContent = t; vicon.innerHTML = ICONS[ic]; vlabel.style.opacity = 1; vicon.style.opacity = 1; }, 150);
  }
  function lock() { locked = true; if (map) map.stop(); shield.classList.add('on'); pin.classList.add('on'); refreshManual(); }
  function release() {
    locked = false; shield.classList.remove('on'); pin.classList.remove('on');
    clearTimeout(stopTimer); clearTimeout(coordTimer); $('pCoords').style.opacity = 1; phase = 'idle';
    validateBtn.classList.remove('ok', 'stop'); setLabel('Valider la position', 'go');
    refreshManual();
  }

  validateBtn.onclick = () => {
    if (phase !== 'idle') {                         // vert ou rouge -> on arrête
      const wasManual = manual;
      if (manual) cur = null;
      release(); say('Position arrêtée');
      if (wasManual) onMoved();
      return;
    }
    searchEl.value = ''; hideResults(); searchEl.blur();   // la recherche revient à son état de départ
    if (!manual && !cur) return;
    if (map) {
      if (flyTarget) {                              // le vol est en cours : on saute à destination avant de poser le pin
        const f = flyTarget; map.stop(); map.setView(centerFor(f.lat, f.lng, f.z), f.z, { animate: false }); flyTarget = null;
      } else if (!manual) {                         // mode non manuel : on recale la carte sur la destination choisie
        const z = map.getZoom(); map.setView(centerFor(cur.lat, cur.lng, z), z, { animate: false });
      }
    }
    if (manual) syncFromTarget();
    if (!cur) return;
    phase = 'ok';                                   // avant lock() pour que « Carte verrouillée » ne soit pas écrasé
    $('pCoords').textContent = 'Carte verrouillée';
    lock();                                         // pin + effet pop, identique dans les deux modes
    const c = cur;
    coordTimer = setTimeout(() => { if (cur === c) swapCoords(fmtLL(c.lat, c.lng)); }, 1000);   // 1 s après : longitude / latitude

    phase = 'ok';
    validateBtn.classList.add('ok'); setLabel('Position validée', 'ok');
    say(manual ? 'Point placé sur le viseur' : 'Téléporté à ' + (cur && cur.info ? cur.info.title : 'la position'));
    stopTimer = setTimeout(() => {                  // après 1 s : bouton rouge
      phase = 'stop';
      validateBtn.classList.remove('ok'); validateBtn.classList.add('stop');
      setLabel('Stopper la position', 'stop');
    }, 1000);
  };
  function swapCoords(t) {
    const el = $('pCoords'); el.style.transition = 'opacity .15s'; el.style.opacity = 0;
    setTimeout(() => { el.textContent = t; el.style.opacity = 1; }, 150);
  }

  // ───────── Recherche (Entrée ou loupe) + liste de résultats ─────────
  const searchEl = $('search'), resultsEl = $('results');
  let results = [], selIdx = -1, srCtl = null;
  function hideResults() { resultsEl.classList.remove('on'); }
  function renderResults() {
    resultsEl.innerHTML = results.map((r, i) =>
      '<div class="res' + (i === selIdx ? ' sel' : '') + '" data-i="' + i + '"><div class="ri">' + (r.info.flag ? esc(r.info.flag) : PIN) +
      '</div><div class="rt"><b>' + esc(r.info.title) + '</b><small>' + esc(r.info.sub || '') + '</small></div></div>').join('');
    resultsEl.scrollTop = 0; resultsEl.classList.add('on');
  }
  function pickResult(i) {
    if (i === selIdx) { hideResults(); return; }   // re-toucher le résultat choisi ferme la liste
    selIdx = i; renderResults(); selectPlace(results[i]);
  }
  async function doSearch(q) {
    q = q.trim(); if (!q) return;
    const c = parseCoords(q);
    if (c) { hideResults(); selectPlace({ lat: c.lat, lng: c.lng, zoom: c.zoom, info: null }); return; }
    if (srCtl) srCtl.abort(); srCtl = new AbortController();
    say('Recherche…');
    try {
      const res = await searchPlaces(q, srCtl.signal);
      if (!res.length) { hideResults(); return say('Lieu introuvable'); }
      results = res; selIdx = 0; renderResults(); selectPlace(res[0]);   // on va au meilleur résultat, la liste permet d'en choisir un autre
    } catch (e) { if (e.name !== 'AbortError') say('Recherche impossible (réseau)'); }
  }
  searchEl.addEventListener('keydown', e => { if (e.key === 'Enter') { doSearch(searchEl.value); searchEl.blur(); } if (e.key === 'Escape') hideResults(); });
  searchEl.addEventListener('input', hideResults);
  searchEl.addEventListener('paste', () => setTimeout(() => { if (/#c=/.test(searchEl.value)) doSearch(searchEl.value); }, 0));
  $('sbtn').addEventListener('click', e => { e.preventDefault(); doSearch(searchEl.value); searchEl.blur(); });
  resultsEl.addEventListener('click', e => { const row = e.target.closest('.res'); if (row) pickResult(+row.dataset.i); });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#results') && !e.target.closest('#search')) hideResults(); });

  // ───────── Favoris ─────────
  const FKEY = 'spiritgps:favs:v1';
  let favs = []; try { favs = JSON.parse(store.get(FKEY) || '[]') || []; } catch (e) { favs = []; }
  const saveFavs = () => store.set(FKEY, JSON.stringify(favs));
  const favNear = c => c && favs.find(f => distM(f, c) < 40);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function refreshStar() { star.classList.toggle('on', !!(cur && favNear(cur))); }

  star.onclick = () => {
    if (manual && !locked && phase === 'idle') syncFromTarget();
    if (!cur) return say('Choisis d’abord une position');
    const c = cur, ex = favNear(c);
    if (ex) { favs = favs.filter(f => f !== ex); saveFavs(); refreshStar(); renderFavs(); return say('Retiré des favoris'); }
    const i = c.info;
    const f = { id: uid(), lat: c.lat, lng: c.lng, title: i ? i.title : 'Position sélectionnée', sub: i ? i.sub : '', flag: i ? i.flag : '', t: Date.now() };
    favs.unshift(f); saveFavs(); refreshStar(); renderFavs();
    star.classList.remove('pop'); void star.offsetWidth; star.classList.add('pop');
    say('Ajouté aux favoris');
    if (!i) ensureInfo(c).then(inf => { if (inf && !inf.failed) { f.title = inf.title; f.sub = inf.sub; f.flag = inf.flag; saveFavs(); renderFavs(); } });
  };

  const favList = $('favList'), editBtn = $('editFav'), favPage = $('favPage');
  let editing = false;
  function setEdit(on) { editing = on; favPage.classList.toggle('editing', on); editBtn.textContent = on ? 'OK' : 'Modifier'; }
  function renderFavs() {
    favList.innerHTML = favs.map(f =>
      '<div class="fav" data-id="' + esc(f.id) + '"><button class="del" type="button" aria-label="Supprimer"></button>' +
      '<div class="fi">' + (f.flag ? esc(f.flag) : PIN) + '</div>' +
      '<div class="ft"><b>' + esc(f.title) + '</b><small>' + esc(f.sub || '') + '</small><div class="fc">' + f.lat.toFixed(4) + ', ' + f.lng.toFixed(4) + '</div></div>' + CHEV + '</div>').join('');
    favList.style.display = favs.length ? 'block' : 'none';
    $('favEmpty').style.display = favs.length ? 'none' : 'block';
    $('favCount').textContent = favs.length ? favs.length + (favs.length > 1 ? ' destinations enregistrées' : ' destination enregistrée') : '';
    editBtn.style.display = favs.length ? '' : 'none';
    if (!favs.length) setEdit(false);
  }
  editBtn.onclick = () => setEdit(!editing);
  favList.addEventListener('click', e => {
    const row = e.target.closest('.fav'); if (!row) return;
    const f = favs.find(x => x.id === row.dataset.id); if (!f) return;
    if (e.target.closest('.del')) {
      row.classList.add('gone');
      setTimeout(() => { favs = favs.filter(x => x !== f); saveFavs(); renderFavs(); refreshStar(); }, 240);
      return;
    }
    if (editing) return;
    go('home');                                     // on revient à l'accueil et la carte se place sur le favori
    setTimeout(() => { selectPlace({ lat: f.lat, lng: f.lng, zoom: 15, info: { title: f.title, sub: f.sub, flag: f.flag } }); say(f.title); }, 120);
  });

  // ───────── Onglets ─────────
  const tabEls = [...document.querySelectorAll('#tabs .tab')], panel = $('panel'), topbar = $('topbar');
  function go(name) {
    const fav = name === 'favs', wasAway = panel.classList.contains('away');
    tabEls.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    favPage.classList.toggle('on', fav); favPage.setAttribute('aria-hidden', String(!fav));
    topbar.classList.toggle('favs', fav);
    panel.classList.toggle('away', fav);
    if (fav) { renderFavs(); $('pscroll').scrollTop = 0; hideResults(); searchEl.blur(); }
    else { setEdit(false); if (wasAway && panel.animate) panel.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' }); }
  }
  tabEls.forEach(t => t.onclick = () => go(t.dataset.tab));

  renderFavs();
  refreshManual();
})();
</script>
</body>
</html>
